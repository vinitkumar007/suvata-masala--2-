services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: suvata
      POSTGRES_USER: suvata
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD set karein}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suvata -d suvata"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/suvata
      DB_USER: suvata
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD set karein}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
